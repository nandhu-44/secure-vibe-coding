name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.3.4
      - run: python tools/lint_skills.py
      - run: python tools/build_dist.py --check
      - run: python -m pytest tests -q
      - name: Dogfood - scan this repo (fixtures excluded)
        run: python skills/secure-coding/scripts/secscan.py skills tools evals hooks .github
